appId: com.stemkit.app
productName: StemKit
directories:
  output: release
files:
  - out/**/*
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: danvelope
  repo: stemkit
extraResources:
  - from: python
    to: python
mac:
  category: public.app-category.music
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  extraResources:
    - from: extras/ffmpeg-mac/ffmpeg
      to: ffmpeg/ffmpeg
win:
  icon: build/icon.png
  target:
    - target: nsis
    - target: zip
  extraResources:
    - from: extras/ffmpeg-win/ffmpeg.exe
      to: ffmpeg/ffmpeg.exe
nsis:
  oneClick: true
  perMachine: false
linux:
  icon: build/icon.png
  category: AudioVideo
  executableName: stemkit
  vendor: danvelope
  maintainer: danvelope
  synopsis: Local YouTube stem splitter and player
  description: Split songs into isolated stems locally — vocals, drums, bass and more.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  desktop:
    StartupWMClass: stemkit
  extraResources:
    - from: extras/ffmpeg-linux/ffmpeg
      to: ffmpeg/ffmpeg
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2
